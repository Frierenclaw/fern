[project]
name = "src"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=15.5.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[all]>=0.136.3",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
    "pipecat-ai-prebuilt>=1.0.2",
    "pipecat-ai[livekit,openai,silero,webrtc]>=1.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "redis>=8.0.0",
    "tortoise-orm>=1.1.7",
    "types-aiobotocore-s3>=3.7.0",
    "tzdata>=2026.2",
    "uvicorn>=0.48.0",
]


[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4

lint.select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "ASYNC", # async best practices
]

lint.ignore = [
    "E501",
    "RUF001",
    "B904",
    "N802",
    "RUF002"
]

extend-exclude = [
    "models/migrations",
    "tests/"
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["core", "app"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.tortoise]
tortoise_orm = "core.config.TORTOISE_ORM"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "respx>=0.22.0",
    "fakeredis>=2.25.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["api", "redis_db", "core", "models"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
