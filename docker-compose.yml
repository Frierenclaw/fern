services:
  backend:
    build:
       context: ./src

    env_file:
      - .env

    networks:
      - backend_network

    ports:
      - 8080:80

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - backend_network
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-60000:50000-60000/udp"
    restart: unless-stopped

  postgres:
    image: postgres:18.1
    env_file:
      - .env

    networks:
      - backend_network

    volumes:
      - postgres_data:/var/lib/postgresql/pgdata
    restart: unless-stopped

  redis:
     image: redis:alpine
     env_file:
       - .env

     command: redis-server --requirepass ${REDIS_PASSWORD}
     volumes:
     - redis_data:/data
     networks:
       - backend_network
     restart: unless-stopped

networks:
  backend_network:
    driver: bridge

volumes:
  postgres_data:
  # redis_data: